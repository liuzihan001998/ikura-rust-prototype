[package]
name = "ikura-rust-prototype"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
fontdue = "0.9"
# Android's Noto CJK collection uses CFF2 variable outlines. Enable their
# parsing in the ttf-parser version shared with fontdue.
ttf-parser = { version = "0.25", default-features = false, features = ["variable-fonts"] }
flate2 = "1"

# Keep SDL's native-library discovery specific to each platform. Desktop builds
# use their system SDL installation, while Android builds compile SDL from the
# source bundled by sdl2-sys with the installed NDK.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
sdl2 = { version = "0.38", features = ["use-pkgconfig", "mixer"] }

[target.'cfg(target_os = "windows")'.dependencies]
sdl2 = { version = "0.38", features = ["use-vcpkg", "mixer"] }

[target.'cfg(target_os = "android")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "mixer"] }
